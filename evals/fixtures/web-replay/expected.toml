[[plant]]
id = "sentry-replay-enabled"
surface = "session_replay"
key = "sentry-replay"
file = "src/sentry.ts"
match = "Sentry.replayIntegration({"
severity = "medium"
runtime = false

[[plant]]
id = "sentry-mask-all-text-off"
surface = "session_replay.option"
key = "sentry-replay"
file = "src/sentry.ts"
match = "maskAllText: false"
severity = "high"
runtime = false

[[plant]]
id = "sentry-mask-all-inputs-off"
surface = "session_replay.option"
key = "sentry-replay"
file = "src/sentry.ts"
match = "maskAllInputs: false"
severity = "critical"
runtime = false

[[plant]]
